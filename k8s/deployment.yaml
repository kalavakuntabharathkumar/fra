apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scoring-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-scoring-api
  template:
    metadata:
      labels:
        app: fraud-scoring-api
    spec:
      containers:
        - name: api
          image: fraud-scoring-api:local
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-db
                  key: database-url
            - name: MODEL_PATH
              value: /app/models/fraud_model.joblib
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-scoring-api
spec:
  selector:
    app: fraud-scoring-api
  ports:
    - port: 8000
      targetPort: 8000
